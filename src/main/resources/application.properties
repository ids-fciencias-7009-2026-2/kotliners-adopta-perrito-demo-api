spring.application.name=adoptaPerrito
spring.datasource.url=jdbc:postgresql://${URL_DB}
spring.datasource.username=${USER_DB}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# URL del frontend para CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}

# URL base del servidor para generar URLs de recursos
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Directorio de uploads de imagenes
upload.dir=${UPLOAD_DIR:#{systemProperties['user.dir']}/uploads}

# Configuracion de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Configuracion de correo (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
internal.email.from=${MAIL_FROM:noreply@colitas.mx}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# APIs externas de informacion de razas
